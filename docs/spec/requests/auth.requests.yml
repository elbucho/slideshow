Login:
  required: true
  content:
    application/json:
      schema:
        $ref: './users.requests.yml#/UserCredentials'
      example:
        username: 'test_user@gmail.com'
        password: 'TestPass1234!'

DeleteSessions:
  required: true
  content:
    application/json:
      schema:
        type: object

        required:
          - ids

        properties:
          ids:
            type: array
            items:
              $ref: '../schemas/common.schema.yml#/EntityId'