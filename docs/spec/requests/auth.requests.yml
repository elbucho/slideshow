LoginCredentials:
  type: object

  required:
    - username
    - password

  properties:
    username:
      $ref: '../schemas/common.schema.yml#/NonEmptyString'
    password:
      $ref: '../schemas/common.schema.yml#/Password'

Login:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/LoginCredentials'
      example:
        username: 'test_user@gmail.com'
        password: 'TestPass1234!'

DeleteSessions:
  required: true
  content:
    application/json:
      schema:
        type: object

        required:
          - ids

        properties:
          ids:
            type: array
            items:
              $ref: '../schemas/common.schema.yml#/EntityId'