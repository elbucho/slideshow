UserCredentials:
  type: object

  properties:
    username:
      $ref: '../schemas/common.schema.yml#/NonEmptyString'

    password:
      $ref: '../schemas/common.schema.yml#/Password'

CreateUserSchema:
  allOf:
    - $ref: '#/UserCredentials'
    - type: object

      required:
        - email
        - username
        - password

UpdateUserSchema:
  $ref: '#/UserCredentials'

CreateUser:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/CreateUserSchema'
      example:
        email: 'test_user@gmail.com'
        username: 'TestUser12'
        password: 'TestPass1234!'

UpdateUser:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/UpdateUserSchema'