      message: The request body contains an invalid schema
      details: {}

PayloadTooLarge:
  summary: The uploaded file exceeds server limits
  value:
    error:
      code: PAYLOAD_TOO_LARGE
      message: The uploaded file exceeds server limits
      details: { }

MediaTypeNotSupported:
