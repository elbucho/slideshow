InvalidToken:
  summary: The token provided by the user was invalid
  value:
    type: error
    code: INVALID_CREDENTIALS
    details:
      message: Invalid token

InvalidUsernameOrPassword:
  summary: The username/email or password provided by the user is invalid
  value:
    type: error
    code: INVALID_CREDENTIALS
    details:
      message: Invalid username or password

AccountLocked:
  summary: The user's account is currently locked out
  value:
    type: error
    code: INVALID_CREDENTIALS
    details:
      message: Account is currently locked out

SessionNotFound:
  summary: The referenced session was not found
  value:
    type: error
    code: SESSION_NOT_FOUND
    details:
      message: Invalid token