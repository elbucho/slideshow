get:
  operationId: getProfile
  summary: Retrieve the logged-in user's profile
  tags:
    - Profiles
  responses:
    200:
      $ref: '../../responses/profiles.responses.yml#/ProfileFetched'
    401:
      $ref: '../../responses/auth.responses.yml#/TokenCredentialsFailure'
    404:
      $ref: '../../responses/profiles.responses.yml#/ProfileNotFound'

post:
  operationId: createProfile
  summary: Create a profile for the logged-in user
  tags:
    - Profiles
  requestBody:
    $ref: '../../requests/profiles.requests.yml#/CreateProfile'
  responses:
    201:
      $ref: '../../responses/profiles.responses.yml#/ProfileCreated'
    400:
      $ref: '../../responses/common.responses.yml#/ValidationError'
    401:
      $ref: '../../responses/auth.responses.yml#/TokenCredentialsFailure'

patch:
  operationId: updateProfile
  summary: Update the profile for the logged-in user
  tags:
    - Profiles
  requestBody:
    $ref: '../../requests/profiles.requests.yml#/UpdateProfile'
  responses:
    200:
      $ref: '../../responses/profiles.responses.yml#/ProfileUpdated'
    400:
      $ref: '../../responses/common.responses.yml#/ValidationError'
    401:
      $ref: '../../responses/auth.responses.yml#/TokenCredentialsFailure'