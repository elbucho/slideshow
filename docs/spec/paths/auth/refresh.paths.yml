post:
  operationId: refreshTokens
  summary: Refresh your tokens
  tags:
    - Authentication
  security:
    - RefreshToken: []
  responses:
    200:
      $ref: '../../responses/auth.responses.yml#/RefreshResponse'
    401:
      $ref: '../../responses/auth.responses.yml#/TokenCredentialsFailure'
    403:
      $ref: '../../responses/auth.responses.yml#/SessionRevoked'
    500:
      $ref: '../../responses/common.responses.yml#/InternalServerError'