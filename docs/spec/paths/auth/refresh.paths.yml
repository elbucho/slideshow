post:
  operationId: refreshTokens
  summary: Refresh your tokens
  tags:
    - Authentication
  security:
    - RefreshToken: []
  responses:
    200:
      $ref: '../../responses/auth.responses.yml#/TokensRefreshed'
    401:
      $ref: '../../responses/auth.responses.yml#/RefreshCredentialFailure'
    500:
      $ref: '../../responses/common.responses.yml#/InternalServerError'