post:
  operationId: login
  summary: Log into the app
  tags:
    - Authentication
  security: []
  requestBody:
    $ref: '../../requests/auth.requests.yml#/Login'
  responses:
    200:
      $ref: '../../responses/auth.responses.yml#/LoggedIn'
    400:
      $ref: '../../responses/common.responses.yml#/ValidationError'
    401:
      $ref: '../../responses/auth.responses.yml#/LoginFailed'
    500:
      $ref: '../../responses/common.responses.yml#/InternalServerError'