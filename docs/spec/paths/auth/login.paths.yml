post:
  operationId: login
  summary: Log into the app
  tags:
    - Authentication
  security: []
  requestBody:
    $ref: '../../requests/auth.requests.yml#/Login'
  responses:
    200:
      $ref: '../../responses/auth.responses.yml#/LoginResponse'
    400:
      $ref: '../../responses/common.responses.yml#/ValidationError'
    401:
      $ref: '../../responses/auth.responses.yml#/InvalidCredentials'
    500:
      $ref: '../../responses/common.responses.yml#/InternalServerError'