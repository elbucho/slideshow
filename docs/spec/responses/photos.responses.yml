PhotoNotFound:
  description: Requested photo was not found in the database
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceNotFound'
          - type: object

            properties:
              details:
                type: object

                properties:
                  resource_type:
                    const: photo

PhotoFetched:
  description: User photo metadata
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceFetched'
          - type: object
            properties:
              details:
                $ref: '../schemas/photos.schema.yml#/Photo'

PhotosFetched:
  description: User photos list
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourcesFetched'
          - type: object
            properties:
              details:
                type: array
                items:
                  $ref: '../schemas/photos.schema.yml#/Photo'

PhotoUploaded:
  description: Photo successfully uploaded
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceCreated'
          - type: object
            properties:
              details:
                $ref: '../schemas/photos.schema.yml#/Photo'

PhotoUpdated:
  description: Photo successfully updated
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceUpdated'
          - type: object
            properties:
              details:
                $ref: '../schemas/photos.schema.yml#/Photo'

PhotoDeleted:
  description: Photo successfully deleted
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceDeleted'
          - type: object

            properties:
              details:
                type: object

                properties:
                  message:
                    const: The photo was deleted successfully

PhotoImageFetched:
  description: The image associated with the given photo
  content:
    image/jpeg:
      schema:
        type: string
        format: binary

    image/png:
      schema:
        type: string
        format: binary

    image/webp:
      schema:
        type: string
        format: binary