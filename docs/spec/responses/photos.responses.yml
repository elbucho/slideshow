PhotoFetched:
  description: User photo metadata
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/MessageResponse'
          - type: object
            properties:
              data:
                $ref: '../schemas/photos.schema.yml#/Photo'

PhotosFetched:
  description: User photos list
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/MessageResponse'
          - type: object
            properties:
              data:
                $ref: '../schemas/photos.schema.yml#/Photos'

PhotoUploaded:
  description: Photo successfully uploaded
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/MessageResponse'
          - type: object
            properties:
              data:
                $ref: '../schemas/photos.schema.yml#/Photo'

PhotoUpdated:
  description: Photo successfully updated
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/MessageResponse'
          - type: object
            properties:
              data:
                $ref: '../schemas/photos.schema.yml#/Photo'

PhotoDeleted:
  description: Photo successfully deleted
  content:
    application/json:
      schema:
        $ref: '../schemas/common.schema.yml#/MessageResponse'
      examples:
        PhotoDeleted:
          $ref: '../examples/photos.examples.yml#/PhotoDeleted'

PhotoImageFetched:
  description: The image associated with the given photo
  content:
    image/jpeg:
      schema:
        type: string
        format: binary

    image/png:
      schema:
        type: string
        format: binary

    image/webp:
      schema:
        type: string
        format: binary
