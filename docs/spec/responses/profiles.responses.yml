ProfileFetched:
  description: Profile was successfully fetched
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceFetched'
          - type: object
            properties:
              details:
                $ref: '../schemas/profiles.schema.yml#/Profile'

ProfileNotFound:
  description: No profile was found for the logged-in user
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceNotFound'
          - type: object

            properties:
              details:
                type: object

                properties:
                  resource_type:
                    const: profile

ProfileCreated:
  description: The profile was successfully created
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceCreated'
          - type: object
            properties:
              details:
                $ref: '../schemas/profiles.schema.yml#/Profile'

ProfileUpdated:
  description: The profile was successfully updated
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceUpdated'
          - type: object
            properties:
              details:
                $ref: '../schemas/profiles.schema.yml#/Profile'

AvatarFetched:
  description: The user's profile avatar image
  content:
    image/jpeg:
      schema:
        type: string
        format: binary

    image/png:
      schema:
        type: string
        format: binary

    image/webp:
      schema:
        type: string
        format: binary

AvatarNotFound:
  description: The user's profile avatar is not set
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceNotFound'
          - type: object

            properties:
              details:
                type: object

                properties:
                  resource_type:
                    const: profile

AvatarUpdated:
  description: The user's profile avatar was updated successfully
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceUpdated'
          - type: object

            properties:
              details:
                type: object

                properties:
                  message:
                    const: Avatar updated successfully

AvatarDeleted:
  description: The user's profile avatar was deleted successfully
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceDeleted'
          - type: object

            properties:
              details:
                type: object

                properties:
                  message:
                    const: The avatar was deleted successfully