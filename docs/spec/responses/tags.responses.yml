TagFetched:
  description: User tags
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceFetched'
          - type: object
            properties:
              details:
                $ref: '../schemas/tags.schema.yml#/Tag'

TagsFetched:
  description: User tags list
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourcesFetched'
          - type: object
            properties:
              details:
                type: array
                items:
                  $ref: '../schemas/tags.schema.yml#/Tag'

TagNotFound:
  description: Requested tag was not found in the database
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceNotFound'
          - type: object

            properties:
              details:
                type: object

                properties:
                  resource_type:
                    const: tag

TagsCreated:
  description: Tags successfully created
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourcesCreated'
          - type: object
            properties:
              details:
                type: array
                items:
                  $ref: '../schemas/tags.schema.yml#/Tag'

TagUpdated:
  description: Tag successfully updated
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceUpdated'
          - type: object
            properties:
              details:
                $ref: '../schemas/tags.schema.yml#/Tag'

TagDeleted:
  description: Tag successfully deleted
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceDeleted'
          - type: object

            properties:
              details:
                type: object

                properties:
                  message:
                    const: The tag was deleted successfully

TagsDeleted:
  description: Tags successfully deleted
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourcesDeleted'
          - type: object
            properties:
              details:
                allOf:
                  - $ref: '../schemas/tags.schema.yml#/TagIds'
                  - type: object

                    properties:
                      message:
                        const: The referenced tags were successfully deleted