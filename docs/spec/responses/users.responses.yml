UserCreated:
  description: User was successfully created
  headers:
    Location:
      $ref: '../headers/common.headers.yml#/Location'
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceCreated'
          - type: object
            additionalProperties: true

            properties:
              details:
                $ref: '../schemas/users.schema.yml#/User'

UserFetched:
  description: User was successfully fetched
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceFetched'
          - type: object
            additionalProperties: true

            properties:
              details:
                $ref: '../schemas/users.schema.yml#/User'

UserAlreadyExists:
  description: User already exists in the database
  content:
    application/json:
      schema:
        $ref: '../schemas/common.schema.yml#/ResourceAlreadyExists'
      examples:
        UserExists:
          $ref: '../examples/users.examples.yml#/UserExists'

UserUpdated:
  description: User was successfully updated
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceUpdated'
          - type: object
            additionalProperties: true

            properties:
              details:
                $ref: '../schemas/users.schema.yml#/User'

UserDeleted:
  description: User was successfully deleted
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceDeleted'
          - type: object
            additionalProperties: true

            properties:
              details:
                type: object

                properties:
                  message:
                    const: The user was deleted successfully