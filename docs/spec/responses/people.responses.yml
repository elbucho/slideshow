PersonFetched:
  description: Person entity
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceFetched'
          - type: object
            properties:
              details:
                $ref: '../schemas/people.schema.yml#/Person'

PersonNotFound:
  description: Requested person was not found in the database
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceNotFound'
          - type: object

            properties:
              details:
                type: object

                properties:
                  resource_type:
                    const: person

PeopleFetched:
  description: User people list
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourcesFetched'
          - type: object
            properties:
              details:
                type: array
                items:
                  $ref: '../schemas/people.schema.yml#/Person'

PeopleCreated:
  description: People successfully created
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourcesCreated'
          - type: object
            properties:
              details:
                type: array
                items:
                  $ref: '../schemas/people.schema.yml#/Person'

PersonUpdated:
  description: Person successfully updated
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceUpdated'
          - type: object
            properties:
              details:
                $ref: '../schemas/people.schema.yml#/Person'

PersonDeleted:
  description: Person successfully deleted
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceDeleted'
          - type: object

            properties:
              details:
                type: object

                required:
                  - message

                properties:
                  message:
                    const: The person was deleted successfully

PeopleDeleted:
  description: People successfully deleted
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourcesDeleted'
          - type: object
            properties:
              details:
                allOf:
                  - $ref: '../schemas/people.schema.yml#/PersonIds'
                  - type: object

                    required:
                      - message

                    properties:
                      message:
                        const: The referenced people were successfully deleted