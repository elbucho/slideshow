LoggedIn:
  description: Login was successful
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/MessageResponse'
          - type: object
            properties:
              message:
                type: string
                const: Login successful
              data:
                $ref: '../schemas/auth.schema.yml#/Tokens'

LoginFailed:
  description: Login failed
  content:
    application/json:
      schema:
        $ref: '../schemas/common.schema.yml#/InvalidCredentials'
      examples:
        InvalidUser:
          $ref: '../examples/auth.examples.yml#/InvalidUser'

        AccountLocked:
          $ref: '../examples/auth.examples.yml#/AccountLocked'

LoggedOut:
  description: Logout was successful
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/MessageResponse'
          - type: object
            properties:
              message:
                const: Logout successful

InvalidUser:
  description: Invalid user detected
  content:
    application/json:
      schema:
        $ref: '../schemas/common.schema.yml#/ErrorResponse'
      examples:
        InvalidUser:
          $ref: '../examples/auth.examples.yml#/InvalidUser'

TokensRefreshed:
  description: Refresh was successful
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/MessageResponse'
          - type: object
            properties:
              message:
                const: New auth tokens issued
              data:
                $ref: '../schemas/auth.schema.yml#/Tokens'

RefreshCredentialFailure:
  description: |
    Either the token provided was invalid, or the
    session associated with the provided token was
    not found.
  content:
    application/json:
      schema:
        oneOf:
          - allOf:
              - $ref: '../schemas/common.schema.yml#/ErrorResponse'
              - type: object

                properties:
                  error:
                    $ref: '../schemas/common.schema.yml#/InvalidCredentials'
          - allOf:
              - $ref: '../schemas/common.schema.yml#/ErrorResponse'
              - type: object

                properties:
                  error:
                    $ref: '../schemas/common.schema.yml#/SessionNotFound'
      examples:
        InvalidToken:
          $ref: '../examples/auth.examples.yml#/InvalidToken'

        SessionNotFound:
          $ref: '../examples/auth.examples.yml#/SessionNotFound'

SessionFetched:
  description: Retrieve a target active user session
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/MessageResponse'
          - type: object
            properties:
              data:
                $ref: '../schemas/auth.schema.yml#/Session'

SessionsFetched:
  description: Retrieve all active user sessions
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/MessageResponse'
          - type: object
            properties:
              data:
                $ref: '../schemas/auth.schema.yml#/Sessions'

SessionDeleted:
  description: Delete a target active user session
  content:
    application/json:
      schema:
        $ref: '../schemas/common.schema.yml#/MessageResponse'
      examples:
        DeleteSession:
          $ref: '../examples/auth.examples.yml#/SessionDeleted'

SessionsDeleted:
  description: Delete a list of active user sessions
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/MessageResponse'
          - type: object
            properties:
              data:
                $ref: '../schemas/auth.schema.yml#/SessionIds'
      examples:
        DeleteSessions:
          $ref: '../examples/auth.examples.yml#/SessionsDeleted'