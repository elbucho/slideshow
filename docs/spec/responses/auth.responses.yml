LoggedIn:
  description: Login was successful
  content:
    application/json:
      schema:
        $ref: '../schemas/common.schema.yml#/Authenticated'

InvalidCredentials:
  description: Invalid user credentials provided
  content:
    application/json:
      schema:
        $ref: '../schemas/common.schema.yml#/InvalidCredentials'
      examples:
        InvalidToken:
          $ref: '../examples/auth.examples.yml#/InvalidToken'
        InvalidUsernameOrPassword:
          $ref: '../examples/auth.examples.yml#/InvalidUsernameOrPassword'
        AccountLocked:
          $ref: '../examples/auth.examples.yml#/AccountLocked'

AuthenticationRequired:
  description: |
    The user's tokens have expired or are invalid,
    and they must log in again
  content:
    application/json:
      schema:
        $ref: '../schemas/common.schema.yml#/AuthenticationRequired'

LoggedOut:
  description: Logout was successful
  content:
    application/json:
      schema:
        $ref: '../schemas/common.schema.yml#/LoggedOut'

TokensRefreshed:
  description: Refresh was successful
  content:
    application/json:
      schema:
        $ref: '../schemas/common.schema.yml#/TokensRefreshed'

TokenCredentialsFailure:
  description: |
    Either the token provided was invalid, or the
    session associated with the provided token was
    not found.
  content:
    application/json:
      schema:
        oneOf:
          - $ref: '../schemas/common.schema.yml#/InvalidCredentials'
          - $ref: '../schemas/common.schema.yml#/SessionNotFound'
      examples:
        InvalidToken:
          $ref: '../examples/auth.examples.yml#/InvalidToken'

        SessionNotFound:
          $ref: '../examples/auth.examples.yml#/SessionNotFound'

InsufficientPermissions:
  description: |
    The user has attempted to access a resource
    they have insufficient permissions for
  content:
    application/json:
      schema:
        $ref: '../schemas/common.schema.yml#/InsufficientPermissions'

SessionExpired:
  description: |
    The session referenced by the refresh token
    is no longer active
  content:
    application/json:
      schema:
        $ref: '../schemas/common.schema.yml#/SessionExpired'

SessionNotFound:
  description: |
    Unable to locate a session associated with
    the provided token
  content:
    application/json:
      schema:
        $ref: '../schemas/common.schema.yml#/SessionNotFound'

SessionFetched:
  description: Retrieve a target active user session
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceFetched'
          - type: object
            properties:
              details:
                $ref: '../schemas/auth.schema.yml#/Session'

SessionsFetched:
  description: Retrieve all active user sessions
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourcesFetched'
          - type: object
            properties:
              details:
                type: array
                items:
                  $ref: '../schemas/auth.schema.yml#/Session'

SessionDeleted:
  description: Delete a target active user session
  content:
    application/json:
      schema:
        $ref: '../schemas/common.schema.yml#/ResourceDeleted'

SessionsDeleted:
  description: Delete a list of active user sessions
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourcesDeleted'
          - type: object
            properties:
              details:
                $ref: '../schemas/auth.schema.yml#/SessionIds'