SlideshowFetched:
  description: User slideshows
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/MessageResponse'
          - type: object
            properties:
              data:
                $ref: '../schemas/slideshows.schema.yml#/Slideshow'

SlideshowsFetched:
  description: User slideshows list
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/MessageResponse'
          - type: object
            properties:
              data:
                $ref: '../schemas/slideshows.schema.yml#/Slideshows'

SlideshowCreated:
  description: Slideshow successfully created
  headers:
    Location:
      $ref: '../headers/common.headers.yml#/Location'
  content:
