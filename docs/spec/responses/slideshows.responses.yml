  content:
    application/json:
      schema:
        $ref: '../schemas/common.schema.yml#/MessageResponse'
      examples:
        SlideshowDeleted:
          $ref: '../examples/slideshows.examples.yml#/SlideshowDeleted'

SlideshowsDeleted:
