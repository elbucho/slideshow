SlideshowFetched:
  description: User slideshows
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceFetched'
          - type: object
            properties:
              details:
                $ref: '../schemas/slideshows.schema.yml#/Slideshow'

SlideshowsFetched:
  description: User slideshows list
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourcesFetched'
          - type: object
            properties:
              details:
                type: array
                items:
                  $ref: '../schemas/slideshows.schema.yml#/Slideshow'

SlideshowNotFound:
  description: Requested slideshow was not found in the database
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceNotFound'
          - type: object

            properties:
              details:
                type: object

                properties:
                  resource_type:
                    const: slideshow

SlideshowCreated:
  description: Slideshow successfully created
  headers:
    Location:
      $ref: '../headers/common.headers.yml#/Location'
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceCreated'
          - type: object
            properties:
              details:
                $ref: '../schemas/slideshows.schema.yml#/Slideshow'

SlideshowUpdated:
  description: Slideshow successfully updated
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceUpdated'
          - type: object
            properties:
              data:
                $ref: '../schemas/slideshows.schema.yml#/Slideshow'

SlideshowDeleted:
  description: Slideshow successfully deleted
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourceDeleted'
          - type: object

            properties:
              details:
                type: object

                required:
                  - message

                properties:
                  message:
                    const: The slideshow was deleted successfully

SlideshowsDeleted:
  description: Slideshows successfully deleted
  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/ResourcesDeleted'
          - type: object
            properties:
              details:
                allOf:
                  $ref: '../schemas/slideshows.schema.yml#/SlideshowIds'
                  type: object

                  required:
                    - message

                  properties:
                    message:
                      const: The referenced slideshows were successfully deleted