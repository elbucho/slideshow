  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/MessageResponse'
          - type: object
            properties:
              data:
                $ref: '../schemas/slideshows.schema.yml#/SlideshowIds'
      examples:
        SlideshowsDeleted:
          $ref: '../examples/slideshows.examples.yml#/SlideshowsDeleted'