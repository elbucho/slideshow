  content:
    application/json:
      schema:
        allOf:
          - $ref: '../schemas/common.schema.yml#/MessageResponse'
          - type: object
            properties:
              data:
                $ref: '../schemas/slideshows.schema.yml#/Slideshow'

SlideshowDeleted:
