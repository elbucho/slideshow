SessionIds:
  type: object

  required:
    - session_ids

  properties:
    session_ids:
      type: array
      items:
        $ref: './common.schema.yml#/EntityId'

Tokens:
  type: object

  required:
    - access_token
    - refresh_token

  properties:
    access_token:
      type: string
      minLength: 1
      description: JWT access token used to authenticate API requests
    refresh_token:
      type: string
      minLength: 1
      description: JWT refresh token used to keep user sessions alive

Session:
  allOf:
    - $ref: './common.schema.yml#/BaseEntity'
    - type: object

      required:
        - tokenExpiresAt
        - current

      properties:
        tokenExpiresAt:
          $ref: './common.schema.yml#/NullableTimestamp'

        lastActiveAt:
          $ref: './common.schema.yml#/NullableTimestamp'

        userId:
          type: integer

        current:
          type: boolean
          description: Indicates whether this is the user's current session.

        ipAddress:
          type: string
          format: ipv4
          description: IP address from which the session was established.

        userAgent:
          type: string
          description: User agent reported by the client.

SessionLimitReached:
  allOf:
    - $ref: './common.schema.yml#/APIResponse'
    - type: object

      properties:
        type:
          const: success
        code:
          const: SESSION_LIMIT_REACHED
        details:
          type: object

          required:
            - temporary_token
            - sessions

          properties:
            temporary_token:
              type: string
            sessions:
              type: array
              items:
                $ref: '#/Session'