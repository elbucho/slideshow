PersonIds:
  type: object

  required:
    - person_ids

  properties:
    person_ids:
      type: array
      items:
        $ref: './common.schema.yml#/EntityId'

PersonCredentials:
  type: object

  properties:
    firstName:
      $ref: './common.schema.yml#/NonEmptyString'

    lastName:
      $ref: './common.schema.yml#/NonEmptyString'

    displayName:
      $ref: './common.schema.yml#/NonEmptyString'

    photos:
      type: array
      items:
        $ref: './photos.schema.yml#/Photo'

    photoIds:
      type: array
      items:
        $ref: './common.schema.yml#/EntityId'

CreatePeople:
  type: array
  items:
    allOf:
      - $ref: '#/PersonCredentials'
      - type: object

        required:
          - firstName
          - lastName

UpdatePerson:
  allOf:
    - $ref: '#/PersonCredentials'
    - type: object
      minProperties: 1

Person:
  allOf:
    - $ref: './common.schema.yml#/BaseEntity'
    - $ref: '#/PersonCredentials'
    - type: object

      required:
        - firstName
        - lastName
        - displayName