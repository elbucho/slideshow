EntityId:
  type: integer
  minimum: 1

Timestamp:
  type: string
  format: date-time

NullableTimestamp:
  type:
    - string
    - "null"
  format: date-time

NonEmptyString:
  type: string
  minLength: 1
  maxLength: 255

StringArray:
  type: array
  items:
    type: string

Email:
  type: string
  format: email
  description: User email address

Password:
  type: string
  format: password

  minLength: 8
  maxLength: 255

  description: Plaintext password supplied by the client.
  writeOnly: true

Path:
  type: string
  minLength: 1
  pattern: '^/[^\\s]*$'
  description: API path beginning with a forward slash

BaseEntity:
  type: object

  required:
    - id
    - created_at
    - updated_at

  properties:
    id:
      $ref: '#/EntityId'

    created_at:
      $ref: '#/Timestamp'

    updated_at:
      $ref: '#/Timestamp'

    deleted_at:
      $ref: '#/NullableTimestamp'

ErrorCode:
  type: string

  enum:
    - VALIDATION_ERROR
    - AUTHENTICATION_REQUIRED
    - MFA_RATE_EXCEEDED
    - INVALID_CREDENTIALS
    - SESSION_EXPIRED
    - SESSION_NOT_FOUND
    - SESSION_LIMIT_EXCEEDED
    - INSUFFICIENT_PERMISSIONS
    - RESOURCE_NOT_FOUND
    - RESOURCE_ALREADY_EXISTS
    - INVALID_OPERATION
    - PAYLOAD_TOO_LARGE
    - UNSUPPORTED_MEDIA_TYPE
    - INVALID_IMAGE
    - INTERNAL_SERVER_ERROR

SuccessCode:
  type: string

  enum:
    - RESOURCE_FETCHED
    - RESOURCES_FETCHED
    - RESOURCE_CREATED
    - RESOURCES_CREATED
    - MFA_REQUIRED
    - MFA_CHALLENGE_SENT
    - AUTHENTICATED
    - TOKENS_REFRESHED
    - LOGGED_OUT

APIResponse:
  type: object

  required:
    - type
    - code
    - details

  properties:
    type:
      type: string
      enum:
        - error
        - success
    code:
      OneOf:
        - $ref: '#/ErrorCode'
        - $ref: '#/SuccessCode'
    details:
      type: object

ResourceFetched:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: success
        code:
          const: RESOURCE_FETCHED

ResourcesFetched:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: success
        code:
          const: RESOURCES_FETCHED
        details:
          type: array
          items:
            type: object

ResourceCreated:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: success
        code:
          const: RESOURCE_CREATED

ResourcesCreated:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: success
        code:
          const: RESOURCES_CREATED
        details:
          type: array
          items:
            type: object

ResourceUpdated:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: success
        code:
          const: RESOURCE_UPDATED

ResourceDeleted:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: success
        code:
          const: RESOURCE_DELETED

ResourcesDeleted:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: success
        code:
          const: RESOURCES_DELETED

MFARequired:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: success
        code:
          const: MFA_REQUIRED
        details:
          type: object

          required:
            - mfa_token
            - methods

          properties:
            mfa_token:
              type: string
            methods:
              type: array
              items:
                type: object

                required:
                  - type
                  - endpoint

                properties:
                  type:
                    type: string
                  endpoint:
                    $ref: '#/Path'

MFAChallengeSent:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: success
        code:
          const: MFA_CHALLENGE_SENT
        details:
          type: object

          required:
            - method
            - masked_destination
            - expires_in
            - retry_after

          properties:
            method:
              type: string
              enum:
                - email
                - sms
            masked_destination:
              type: string
            expires_in:
              type: integer
            retry_after:
              type: integer

Authenticated:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: success
        code:
          const: AUTHENTICATED
        details:
          $ref: './auth.schema.yml#/Tokens'

TokensRefreshed:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: success
        code:
          const: TOKENS_REFRESHED
        details:
          $ref: './auth.schema.yml#/Tokens'

LoggedOut:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: success
        code:
          const: LOGGED_OUT

ValidationError:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: error
        code:
          const: VALIDATION_ERROR
        details:
          type: object

          required:
            - message
            - missing_fields

          properties:
            message:
              type: string
              const: The request body contains an invalid schema
            missing_fields:
              type: array
              items:
                $ref: '#/NonEmptyString'

AuthenticationRequired:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: error
        code:
          const: AUTHENTICATION_REQUIRED
        details:
          type: object

          required:
            - message

          properties:
            message:
              type: string
              const: Invalid token

MFARateExceeded:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: error
        code:
          const: MFA_RATE_EXCEEDED
        details:
          type: object

          required:
            - message
            - backoff

          properties:
            message:
              const: MFA request is still being processed
            backoff:
              type: string
              example: 10s remaining

InvalidCredentials:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type: error
        code:
          const: INVALID_CREDENTIALS
        details:
          type: object

          required:
            - message

          properties:
            message:
              type: string
              enum:
                - Invalid token
                - Invalid username or password
                - Account is currently locked out

SessionExpired:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: error
        code:
          const: SESSION_EXPIRED
        details:
          type: object

          required:
            - message
            - token_expired_at

          properties:
            message:
              const: Session expired
            properties:
              token_expired_at:
                $ref: '#/Timestamp'

SessionNotFound:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: error
        code:
          const: SESSION_NOT_FOUND
        details:
          type: object

          required:
            - message

          properties:
            message:
              const: Invalid token

SessionLimitExceeded:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: error
        code:
          const: SESSION_LIMIT_EXCEEDED
        details:
          type: object

          required:
            - message
            - token
            - endpoint

          properties:
            message:
              const: Maximum number of active sessions has been reached
            token:
              type: string
            endpoint:
              $ref: '#/Path'

InsufficientPermissions:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: error
        code:
          const: INSUFFICIENT_PERMISSIONS

        details:
          type: object

          required:
            - message
            - action
            - resource

          properties:
            message:
              const: You do not have the required permissions for that action
            action:
              type: string

              enum:
                - GET
                - POST
                - PUT
                - PATCH
                - DELETE
            resource:
              $ref: '#/Path'

ResourceNotFound:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: error
        code:
          const: RESOURCE_NOT_FOUND
        details:
          type: object

          required:
            - message
            - resource_type
            - resource_key
            - key_value

          properties:
            message:
              const: Unable to locate the requested resource
            resource_type:
              type: string
              enum:
                - user
                - session
                - photo
                - photo_avatar
                - state
                - tag
                - person
                - slideshow
            resource_id:
              type: integer

ResourceAlreadyExists:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: error
        code:
          const: RESOURCE_ALREADY_EXISTS
        details:
          type: object

          required:
            - message
            - unique_key
            - value

          properties:
            message:
              const: A resource with the requested unique key already exists
            unique_key:
              type: string
            value:
              type: string

InvalidOperation:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: error
        code:
          const: INVALID_OPERATION
        details:
          type: object

          required:
            - message

          properties:
            message:
              type: string

PayloadTooLarge:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: error
        code:
          const: PAYLOAD_TOO_LARGE
        details:
          type: object

          required:
            - message
            - payload_size
            - upload_limit

          properties:
            message:
              const: Provided payload exceeds limit
            payload_size:
              type: number
            upload_limit:
              type: number

UnsupportedMediaType:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: error
        code:
          const: UNSUPPORTED_MEDIA_TYPE
        details:
          type: object

          required:
            - message
            - provided_mime_type
            - allowed_mime_types

          properties:
            message:
              const: Unsupported media type
            provided_mime_type:
              type: string
            allowed_mime_types:
              type: array
              items:
                type: string

InvalidImage:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: error
        code:
          const: INVALID_IMAGE
        details:
          type: object

          required:
            - message
            - provided_mime_type

          properties:
            message:
              const: The uploaded file is invalid or corrupted
            provided_mime_type:
              type: string

InternalServerError:
  allOf:
    - $ref: '#/APIResponse'
    - type: object

      properties:
        type:
          const: error
        code:
          const: INTERNAL_SERVER_ERROR
        details:
          type: object

          properties:
            message:
              type: string
            stack:
              type: object