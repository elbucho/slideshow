Page:
  in: query
  name: page
  required: false
  description: Page number

  schema:
    type: integer
    minimum: 1
    default: 1

PageSize:
  in: query
  name: page_size
  required: false
  description: Number of items per page

  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 50

Search:
  in: query
  name: search
  required: false

  schema:
    type: string

Sort:
  in: query
  name: sort
  required: false
  description: |
    Comma-separated list of sort fields.
    Prefix a field with '-' for descending order.
    Example: created_at,-name

  style: form
  explode: false

  schema:
    $ref: '../schemas/common.schema.yml#/StringArray'

IncludeDeleted:
  in: query
  name: include_deleted
  required: false

  schema:
    type: boolean
    default: false

Expand:
  in: query
  name: expand
  required: false
  description: |
    List of related resources to return with the request.
    Example: GET /photos/42?expand=people,tags

  style: form
  explode: false

  schema:
    type: array
    items:
      type: string
      enum:
        - tags
        - people
        - photos