  parameters:
    Page:
      in: query
      name: page
      required: false
      description: Page number
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      in: query
      name: pageSize
      required: false
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Sort:
      in: query
      name: sort
      required: false
      description: |
        Comma-separated list of sort fields.
        Prefix a field with '-' for descending order.
        Example: created_at,-name
      style: form
      explode: false
      schema:
        $ref: '#/components/schemas/StringArray'
    IncludeDeleted:
      in: query
      name: includeDeleted
      required: false
      schema:
        type: boolean
        default: false
    SessionId:
      in: path
      name: id
      required: true
      description: Session identifier
      schema:
        $ref: '#/components/schemas/EntityId'
    SessionExpand:
      in: query
      name: expand
      required: false
      description: |
        List of related resources to return with the request.
        Example: GET /auth/sessions/42?expand=user
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - user
            - user.states
            - user.states.state
    UserExpand:
      in: query
      name: expand
      required: false
      description: |
        List of related resources to return with the request.
        Example: GET /users/42?expand=states.state,sessions
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - states
            - states.state
            - sessions
    Search:
      in: query
      name: search
      required: false
      schema:
        type: string
    Expand:
      in: query
      name: expand
      required: false
      description: |
        List of related resources to return with the request.
        Example: GET /photos/42?expand=people,tags
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    PhotoId:
      in: path
      name: id
      required: true
      description: Photo identifier
      schema:
        $ref: '#/components/schemas/EntityId'
    TagId:
      in: path
      name: id
      required: true
      description: Tag identifier
      schema:
        $ref: '#/components/schemas/EntityId'
    PersonId:
      in: path
      name: id
      required: true
      description: Person identifier
      schema:
        $ref: '#/components/schemas/EntityId'
    SlideshowId:
      in: path
      name: id
      required: true
      description: Slideshow identifier
      schema:
        $ref: '#/components/schemas/EntityId'
  headers:
    Location:
      description: URI of the created resource.
      schema:
        type: string
        format: uri-reference
