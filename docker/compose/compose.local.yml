services:
  nest:
    build:
      target: development
    init: true
    env_file:
      - ../../backends/nest/.env.local
    volumes:
      - ../../backends/nest:/app:Z
      - nest-node-modules:/app/node_modules
    ports:
      - "8000:8000"

  postgres:
    env_file:
      - ../config/postgres.local.env
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  nest-node-modules:
  postgres-data: