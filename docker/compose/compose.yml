# -----------------------------------------------------------------------------
# Slideshow - Base Docker Compose Configuration
#
# This file defines the common service topology shared by all environments.
#
# Environment-specific concerns are defined in:
#
#   compose.local.yml   - Local development
#   compose.ci.yml      - Testing / CI
#   compose.deploy.yml  - Production deployment
#
# -----------------------------------------------------------------------------
name: slideshow

# Build args
x-oci-build-args: &oci-build-args
  OCI_VENDOR: Michael Hinkson <mjhinkson@gmail.com>
  OCI_SOURCE: https://github.com/elbucho/slideshow
  OCI_URL: https://github.com/elbucho/slideshow
  OCI_DOCS: https://github.com/elbucho/slideshow/tree/main/docs
  OCI_LICENSE: MIT
  OCI_VERSION: ${OCI_VERSION}
  OCI_REVISION: ${OCI_REVISION}
  OCI_CREATED: ${OCI_CREATED}

services:
  # Frontends:

  # Backends:
  nest:
    build:
      context: ../../backends/nest
      dockerfile: Dockerfile
      args:
        <<: *oci-build-args
        OCI_TITLE: Slideshow NestJS Backend
        OCI_DESC: NestJS implementation of the Slideshow backend
    profiles:
      - nest
    networks:
      slideshow:
        aliases:
          - api
    depends_on:
      postgres:
        condition: service_healthy

  # Services:
  nginx:
    image: nginx:1.29-alpine
    volumes:
      - ../config/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
    networks:
      slideshow:
        aliases:
          - web
    ports:
      - "80:80"

  postgres:
    image: postgres:17-alpine
    profiles:
      - nest

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      start_period: 15s
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      slideshow:
        aliases:
          - postgres

networks:
  slideshow: