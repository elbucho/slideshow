services:
  nest:
    build:
      target: test-e2e
    env_file:
      - ../../backends/nest/.env.test
    volumes:
      - ../../backends/nest/logs:/app/logs:Z
      - ../../docs/generated/openapi.yml:/app/openapi.yml:ro,Z

  postgres:
    env_file:
      - ../config/postgres.test.env
    tmpfs:
      - /var/lib/postgresql/data