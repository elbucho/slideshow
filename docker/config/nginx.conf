#
# Slideshow reverse proxy
#
# Frontend implementations (React, Vue, Angular, etc.) expose the
# "frontend" network alias.
#
# Backend implementations (NestJS, Django, Symfony, Laravel, etc.)
# expose the "api" network alias.
#
# Documentation server exposes the "openapi" network alias.
#
# Using variables for proxy_pass causes nginx to resolve hostnames at
# request time instead of startup, allowing services to come and go.
#

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # Docker DNS
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Upstreams
    set $frontend http://frontend:5173;
    set $api       http://api:8000;
    set $docs      http://openapi:8080;

    client_max_body_size 50m;

    # -------------------------------------------------------------------------
    # Documentation
    # -------------------------------------------------------------------------

    # Redirect /api/docs -> /api/docs/
    location = /api/docs {
        return 301 /api/docs/;
    }

    location /api/docs/ {
        rewrite ^/api/docs(/.*)$ /api/docs$1 break;

        proxy_pass $docs$uri$is_args$args;

        proxy_http_version 1.1;

        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header X-Forwarded-Host    $host;
        proxy_set_header X-Forwarded-Port    $server_port;
    }

    # -------------------------------------------------------------------------
    # API
    # -------------------------------------------------------------------------

    # Redirect /api -> /api/
    location = /api {
        return 301 /api/;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;

        add_header       X-Debug-URI         $uri always;
        add_header       X-Debug-Request-URI $request_uri always;

        proxy_pass       $api$uri$is_args$args;

        proxy_http_version 1.1;

        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header X-Forwarded-Host    $host;
        proxy_set_header X-Forwarded-Port    $server_port;

        # Support GraphQL subscriptions / WebSockets
        proxy_set_header Upgrade             $http_upgrade;
        proxy_set_header Connection          $connection_upgrade;
    }

    # -------------------------------------------------------------------------
    # Frontend
    # -------------------------------------------------------------------------

    location / {
        proxy_pass $frontend;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Vite HMR / WebSockets
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}